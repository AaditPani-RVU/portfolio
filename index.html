<style>
  :root {
    /* base */
    --bg-0: oklch(0.13 0.012 250);
    --bg-1: oklch(0.16 0.014 250);
    --bg-2: oklch(0.19 0.016 250);
    --surface: oklch(0.20 0.018 250 / 0.55);
    --hairline: oklch(0.40 0.02 250 / 0.25);
    --hairline-strong: oklch(0.55 0.04 250 / 0.45);
    /* text */
    --fg-0: oklch(0.96 0.005 250);
    --fg-1: oklch(0.78 0.012 250);
    --fg-2: oklch(0.58 0.015 250);
    --fg-3: oklch(0.42 0.018 250);
    /* accents */
    --cyan: oklch(0.82 0.14 200);
    --cyan-dim: oklch(0.55 0.10 200);
    --violet: oklch(0.68 0.18 290);
    --violet-dim: oklch(0.45 0.12 290);
    --amber: oklch(0.82 0.14 75);
    --green: oklch(0.78 0.16 145);
    /* fonts */
    --font-display: 'Geist', system-ui, sans-serif;
    --font-body: 'Geist', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Geist Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg-0); color: var(--fg-0); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  body {
    overflow-x: hidden;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, oklch(0.20 0.04 270 / 0.6), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 50%, oklch(0.18 0.05 200 / 0.35), transparent 60%),
      var(--bg-0);
    background-attachment: fixed;
  }

  /* subtle global grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--hairline) 1px, transparent 1px),
      linear-gradient(90deg, var(--hairline) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  /* film grain */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.04;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: overlay;
  }

  ::selection { background: var(--cyan); color: var(--bg-0); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg-0); }
  ::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }

  /* keyframes */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
  @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  @keyframes float-y { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes glow-pulse {
    0%,100% { box-shadow: 0 0 0 0 oklch(0.82 0.14 200 / 0.4); }
    50% { box-shadow: 0 0 24px 0 oklch(0.82 0.14 200 / 0.0); }
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .reveal { opacity: 0; }
  .reveal.in { animation: fade-up 0.9s cubic-bezier(.2,.7,.2,1) forwards; }

  #app { position: relative; z-index: 2; }
</style>
